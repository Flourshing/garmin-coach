name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m compileall -q collect.py garmin_data.py garmin_extended.py garmin_charts.py garmin_service.py garmin_mcp_server.py prepare_openclaw.py configure_models.py prepare_daily_job.py
